name: Validate ODbL regional hiking relations
on:
  push:
    branches: ["feat/nationwide-long-trek-*"]
    paths: ["scripts/collect_osm_regional_treks.py", ".github/workflows/osm-regional-hiking.yml"]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pyproj
      - run: python scripts/collect_osm_regional_treks.py
      - name: Commit independently licensed ODbL dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm_regional_treks_odbl.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: verified region-diverse OpenStreetMap ODbL routes"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
