name: TrekBrain production benchmark

on:
  # The full push suite is now run by trekbrain-production-suite.yml.
  # Manual runs remain available for an isolated 6-trek investigation.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trekbrain-production-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    name: Six real production treks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout benchmark
        uses: actions/checkout@v4

      - name: Wait for this exact Render build
        shell: python
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://trekmap-france.onrender.com
        run: |
          import json, os, time, urllib.request
          expected=os.environ['EXPECTED_SHA'].lower()
          base=os.environ['BASE_URL'].rstrip('/')
          last=''
          for attempt in range(1, 37):
              try:
                  req=urllib.request.Request(base+'/ai/status',headers={'User-Agent':'TrekBrain-production-benchmark/1.0'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=json.load(r)
                  build=str(data.get('build_commit') or '').lower()
                  last=f"build={build[:10]} channel={data.get('release_channel')}"
                  if build == expected:
                      print('Exact production build ready:', build[:12])
                      break
              except Exception as exc:
                  last=f'{type(exc).__name__}: {exc}'
              print(f'wait {attempt}/36: {last}')
              time.sleep(10)
          else:
              raise SystemExit('Render build did not converge to '+expected[:12]+'; last='+last)

      - name: Run three independent six-trek passes
        env:
          EXPECTED_SHA: ${{ github.sha }}
          TREKBRAIN_BENCHMARK_URL: https://trekmap-france.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            echo "=== TrekBrain production pass $pass/3 ==="
            TREKBRAIN_BENCHMARK_OUT="benchmark-results/pass-$pass" \
            GITHUB_RUN_ID="${GITHUB_RUN_ID}-$pass" \
            python scripts/benchmark_trekbrain_v9_production.py
          done

      - name: Show benchmark reports
        if: always()
        shell: bash
        run: |
          find benchmark-results -name 'trekbrain-production-benchmark.md' -print -exec cat {} \; 2>/dev/null || true

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trekbrain-production-benchmark
          path: benchmark-results/
          if-no-files-found: ignore
          retention-days: 14
