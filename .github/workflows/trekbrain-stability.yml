name: TrekBrain v9 stability gate

on:
  push:
    branches: [trekbrain-v9-stability-gate, trekbrain-v9-pipeline-core]
  pull_request:
    branches: [main]

jobs:
  stability-gate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/trekmap_ci
      TREKMAP_ENV: development
      FRONTEND_ORIGINS: http://127.0.0.1:5500,http://localhost:5500
      ORS_API_KEY: ci-placeholder
      TREKBRAIN_VERSION: v9
      TREKBRAIN_FREE_MODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Syntax
        run: python -m compileall -q backend scripts
      - name: Explicit route-logistics pipeline
        run: python scripts/test_trekbrain_v9_pipeline_core.py
      - name: Five reference scenarios in one wired process
        run: python scripts/test_trekbrain_v9_stability_gate.py
      - name: Existing high-risk regressions
        run: |
          python scripts/test_trekbrain_v9_belle_ile_gr340.py
          python scripts/test_trekbrain_v9_belle_ile_canonical.py
          python scripts/test_trekbrain_v9_route_logistics.py
          python scripts/test_trekbrain_v9_relation_stitch.py
          python scripts/test_trekbrain_v9_ors_resilience.py
          python scripts/test_trekbrain_v9_error_codes.py
          python scripts/test_trekbrain_v9_water_display.py
