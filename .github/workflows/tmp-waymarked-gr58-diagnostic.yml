name: Temporary Waymarked GR58 diagnostic

on:
  push:
    branches:
      - trekbrain-v9-bound-full-relation-recovery-20261004

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GR58 full relation
        run: |
          python - <<'PY'
          import json, math, urllib.request

          URL = "https://hiking.waymarkedtrails.org/api/v1/details/relation/9711201"
          req = urllib.request.Request(URL, headers={
              "Accept": "application/json",
              "Accept-Language": "fr",
              "User-Agent": "TrekMap-diagnostic/1.0",
          })
          with urllib.request.urlopen(req, timeout=12) as response:
              payload = json.load(response)

          print("keys=", sorted(payload))
          print("id=", payload.get("id"), "ref=", payload.get("ref"), "name=", payload.get("name"))
          print("group=", payload.get("group"), "linear=", payload.get("linear"), "official_length=", payload.get("official_length"))
          print("bbox=", payload.get("bbox"))
          route = payload.get("route")
          if isinstance(route, str):
              route = json.loads(route)
          print("route_type=", (route or {}).get("route_type"), "route_linear=", (route or {}).get("linear"), "route_length_m=", (route or {}).get("length"))

          R=6378137.0
          def to_ll(p):
              x,y=float(p[0]),float(p[1])
              lon=math.degrees(x/R)
              lat=math.degrees(2*math.atan(math.exp(y/R))-math.pi/2)
              return [lat,lon]
          def hav(a,b):
              lat1,lon1,lat2,lon2=map(math.radians,(a[0],a[1],b[0],b[1]))
              dlat,dlon=lat2-lat1,lon2-lon1
              h=math.sin(dlat/2)**2+math.cos(lat1)*math.cos(lat2)*math.sin(dlon/2)**2
              return 6371.0088*2*math.asin(min(1,math.sqrt(max(0,h))))
          def lines(node):
              if not isinstance(node,dict): return []
              kind=str(node.get("route_type") or "")
              if kind=="base":
                  g=node.get("geometry") or {}
                  raw=g.get("coordinates") or []
                  return [[to_ll(p) for p in raw]] if g.get("type")=="LineString" and len(raw)>=2 else []
              key = "ways" if kind=="linear" else "main" if kind=="route" else None
              if kind=="split":
                  children=node.get("forward") or node.get("backward") or []
              elif key:
                  children=node.get(key) or []
              else:
                  children=[]
              out=[]
              for child in children: out.extend(lines(child))
              return out
          ls=lines(route)
          print("base_lines=",len(ls),"base_points=",sum(map(len,ls)))
          comps=[]; cur=[]
          joins=[]
          for raw in ls:
              line=[list(p) for p in raw]
              if not cur:
                  cur=line; continue
              d0=hav(cur[-1],line[0]); d1=hav(cur[-1],line[-1])
              if d1<d0:
                  line.reverse(); d0=d1
              joins.append(d0)
              if d0<=1.6:
                  cur.extend(line[1:] if hav(cur[-1],line[0])<=0.03 else line)
              else:
                  comps.append(cur); cur=line
          if cur: comps.append(cur)
          comps.sort(key=lambda c:sum(hav(a,b) for a,b in zip(c,c[1:])), reverse=True)
          print("components=",len(comps),"join_max_km=",round(max(joins or [0]),3),"join_over_1_6=",sum(d>1.6 for d in joins))
          for i,c in enumerate(comps[:5]):
              length=sum(hav(a,b) for a,b in zip(c,c[1:]))
              closure=hav(c[0],c[-1])
              maxgap=max([hav(a,b) for a,b in zip(c,c[1:])] or [0])
              print("component",i,"points",len(c),"km",round(length,2),"closure_km",round(closure,3),"maxgap",round(maxgap,3),"first",c[0],"last",c[-1])
          PY
