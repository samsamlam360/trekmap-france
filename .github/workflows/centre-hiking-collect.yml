name: Collect Centre-Val de Loire open multi-day hikes
on:
  push:
    branches: ["feat/centre-multiday-hikes-*"]
    paths:
      - "scripts/collect_centre_multiday_treks.py"
      - ".github/workflows/centre-hiking-collect.yml"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests pyproj
      - name: Read and verify existing OSM geometries (never writes Neon)
        run: python scripts/collect_centre_multiday_treks.py
      - name: Commit validated ODbL data for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/centre_multiday_treks_odbl.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(Centre): validated existing continuous hiking routes, ODbL attribution"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
