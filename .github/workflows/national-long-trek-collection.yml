name: Collect regional long trek candidates
on:
  push:
    branches: ["feat/nationwide-long-trek-*"]
    paths: ["scripts/collect_regional_long_treks.py", ".github/workflows/national-long-trek-collection.yml"]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pyproj
      - run: python scripts/collect_regional_long_treks.py
      - name: Save candidate data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national_long_trek_candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: review connected long trails from regional open sources"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
