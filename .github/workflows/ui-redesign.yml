name: TrekMap UI redesign

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    if: ${{ !contains(github.event.head_commit.message, '[ui-redesign]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Moderniser l'interface TrekMap
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('frontend/index.html')
          s = p.read_text(encoding='utf-8')

          style = r'''
<style id="trekmap-ui-redesign">
:root{
  --tm-green:#176b45;--tm-green-dark:#0d4930;--tm-green-soft:#e8f4ed;
  --tm-orange:#ef8a38;--tm-ink:#14221c;--tm-muted:#718078;--tm-line:#dfe8e2;
  --tm-bg:#f3f6f4;--tm-card:#fff;--tm-shadow:0 12px 35px rgba(20,52,37,.10)
}
body{background:#f3f6f4;color:var(--tm-ink)}
#app{background:#f3f6f4}
.sidebar{
  width:390px;min-width:390px;background:#fff;border-right:1px solid #dce6e0;
  box-shadow:10px 0 38px rgba(17,48,34,.08);overflow:hidden
}
.sidebar.collapsed{margin-left:-390px}
.brand{
  margin:12px 12px 8px;padding:19px 17px;border-radius:20px;
  background:linear-gradient(135deg,#0c3d29 0%,#176b45 58%,#299c69 100%);
  color:#fff;box-shadow:0 12px 30px rgba(18,103,67,.22);position:relative;overflow:hidden
}
.brand:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-70px;top:-100px;background:rgba(255,255,255,.10)}
.brand h1{font-size:24px;letter-spacing:-.04em;position:relative;z-index:1}.brand small{color:rgba(255,255,255,.76);position:relative;z-index:1}
.brand .icon-btn{position:relative;z-index:2;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2)}
.account{margin:0 12px 10px;padding:9px 10px;background:#f7faf8;border:1px solid var(--tm-line);border-radius:15px;box-shadow:0 4px 14px rgba(17,50,35,.045)}
.avatar{background:linear-gradient(145deg,var(--tm-green),#299c69);box-shadow:0 5px 14px rgba(23,107,69,.18)}
.account .ghost-btn{background:#fff;border:1px solid #dce7e1}
.search-wrap{margin:0 12px 9px}.search{height:50px;border:1px solid #cfdcd4;border-radius:15px;background:#fff;padding:14px 44px 14px 16px;font-size:14px;box-shadow:0 6px 18px rgba(18,52,36,.07)}
.search:focus{border-color:#4d9e75;box-shadow:0 0 0 4px rgba(42,165,110,.11),0 7px 22px rgba(18,52,36,.08)}
.search::placeholder{color:#8a9790}.clear-search{top:9px}
.suggestions{top:54px;border:1px solid #dce6e0;border-radius:14px;box-shadow:0 18px 45px rgba(17,50,35,.14)}.suggestion{padding:12px 14px}
.filters{margin:0 12px 8px;padding:11px;border:1px solid var(--tm-line);border-radius:17px;background:#f9fbfa;box-shadow:0 4px 14px rgba(18,52,36,.04)}
.filters:before{content:"FILTRER LES RANDONNÉES";display:block;color:#66766e;font-size:10px;font-weight:900;letter-spacing:.12em;margin:0 2px 7px}
.filter-row{gap:8px}.field label{font-size:10px;color:#728078;text-transform:uppercase;letter-spacing:.04em}.field select,.field input{border-color:#d6e1da;border-radius:10px;background:#fff}.field select:focus{outline:none;border-color:#61a481;box-shadow:0 0 0 3px rgba(42,165,110,.08)}
.filter-actions button{border-radius:10px}.tabs{padding:8px 12px;border-bottom:1px solid #e8eeea;background:#fff;gap:6px}.tab{background:#edf2ef;border:1px solid transparent;border-radius:999px;padding:8px 12px}.tab.active{background:var(--tm-green);box-shadow:0 4px 12px rgba(23,107,69,.18)}
.list-head{padding:11px 15px 6px;background:#fff}.list-head b{font-size:13px}.list-head span{background:#edf5f0;padding:4px 8px;border-radius:999px;color:#577066}
#trek-list{padding:6px 12px 105px;background:#f7f9f8}
.trek-card{border:1px solid #dfe8e2;border-radius:17px;background:#fff;padding:14px;margin-bottom:9px;box-shadow:0 2px 8px rgba(18,50,36,.035);transition:.18s}
.trek-card:hover{transform:translateY(-2px);border-color:#b8d3c3;box-shadow:0 12px 27px rgba(18,50,36,.10)}.trek-card.active{border-color:#3f9b6f;box-shadow:0 0 0 3px rgba(42,165,110,.10),0 12px 27px rgba(18,50,36,.10)}
.trek-title strong{font-size:15px;line-height:1.25}.badges{margin:9px 0 8px}.badge{background:#edf6f1;border-color:#dcebe3;color:#2d624a}.badge.private{background:#f2ecff;border-color:#e7dcfb}.badge.extreme{background:#fff0f0;border-color:#ffd9dc}.trek-meta{font-size:11.5px;color:#66766e;gap:8px}.card-actions{margin-top:10px}.card-actions button{border:1px solid #dfe8e2!important;border-radius:9px!important;background:#f8faf9}
#map{background:#dce7e2}.map-tools{left:auto;right:16px;top:16px;max-width:calc(100% - 32px);justify-content:flex-end}.map-tools button,.map-tools select{border:1px solid rgba(211,225,217,.95);border-radius:13px;background:rgba(255,255,255,.95);box-shadow:var(--tm-shadow);backdrop-filter:blur(12px);padding:10px 12px;font-weight:650;color:#29493a}.map-tools button:hover{transform:translateY(-1px);box-shadow:0 9px 25px rgba(20,50,35,.14)}
.draw-panel{top:72px;border:1px solid #d9e6de;border-radius:19px;box-shadow:0 22px 60px rgba(12,42,28,.20)}.draw-actions .finish{background:linear-gradient(135deg,#176b45,#299c69);box-shadow:0 5px 15px rgba(23,107,69,.20)}
.map-legend{right:16px;bottom:82px;border:1px solid rgba(216,228,220,.95);border-radius:14px;box-shadow:var(--tm-shadow);backdrop-filter:blur(12px)}
.bottom-nav{left:calc(390px + 18px);right:18px;bottom:15px;padding:6px;border-radius:19px;background:rgba(255,255,255,.91);border:1px solid rgba(215,228,220,.95);box-shadow:0 15px 45px rgba(14,45,30,.16);backdrop-filter:blur(18px)}
.bottom-nav button{padding:10px 16px;border-radius:12px;transition:.15s}.bottom-nav button.active,.bottom-nav button:hover{background:#e6f3eb;color:#176b45;box-shadow:inset 0 0 0 1px #d6e9de}
.modal-backdrop{background:rgba(7,23,15,.58);backdrop-filter:blur(5px)}.modal{border:1px solid #e0e9e3;border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.28)}.modal-head h2{letter-spacing:-.025em}.stat{border:1px solid #deebe4;background:linear-gradient(145deg,#f0f8f4,#f9fbfa);border-radius:14px}.toast{border-radius:14px;box-shadow:0 14px 35px rgba(0,0,0,.22)}
input[type=range]{accent-color:#21875b}
/* Visorando-inspired information hierarchy: search first, criteria second, results third. */
@media(min-width:901px){.sidebar:after{content:"Conseil : clique sur une carte pour l’afficher sur la carte";position:absolute;left:14px;right:14px;bottom:10px;padding:7px 10px;border-radius:9px;background:#eef6f1;color:#5c7468;font-size:10px;text-align:center;z-index:20}.sidebar{position:relative}#trek-list{padding-bottom:75px}}
@media(max-width:900px){
  .sidebar{width:min(400px,94vw);min-width:0}.sidebar.collapsed{margin-left:calc(-1 * min(400px,94vw))}
  .brand{margin:8px 8px 7px;border-radius:18px;padding:17px 15px}.brand h1{font-size:21px}
  .account,.search-wrap{margin-left:9px;margin-right:9px}.filters{margin-left:9px;margin-right:9px}
  .map-tools{left:10px;right:10px;top:10px}.map-tools button,.map-tools select{padding:9px 10px}
  .bottom-nav{left:9px;right:9px;bottom:9px}.bottom-nav button{padding:9px 10px}
}
</style>
'''

          js = r'''
<script id="trekmap-ui-redesign-js">
(function(){
  function enhance(){
    const search=document.getElementById('search');
    if(search){search.setAttribute('aria-label','Rechercher une randonnée, un lieu ou une région');}
    const filters=document.querySelector('.filters');
    if(filters && !document.getElementById('tm-filter-toggle')){
      const button=document.createElement('button');
      button.id='tm-filter-toggle';button.type='button';button.textContent='☰  Plus de critères';
      button.style.cssText='width:100%;margin-top:7px;border:1px solid #d7e3dc;background:#eef6f1;color:#176b45;border-radius:10px;padding:9px;font-weight:750;cursor:pointer;display:none';
      filters.appendChild(button);
      button.onclick=function(){filters.classList.toggle('tm-expanded');button.textContent=filters.classList.contains('tm-expanded')?'⌃  Masquer les critères':'☰  Plus de critères'};
    }
    const list=document.getElementById('trek-list');if(list)list.setAttribute('aria-label','Résultats des randonnées');
  }
  function mobileFilters(){
    const f=document.querySelector('.filters'),b=document.getElementById('tm-filter-toggle');
    if(!f||!b)return;
    if(window.innerWidth<=900){
      b.style.display='block';
      if(!f.classList.contains('tm-expanded')){f.style.maxHeight='205px';f.style.overflow='hidden';}
      else{f.style.maxHeight='none';f.style.overflow='visible';}
    }else{b.style.display='none';f.style.maxHeight='none';f.style.overflow='visible';}
  }
  enhance();mobileFilters();window.addEventListener('resize',mobileFilters);setTimeout(enhance,700);
})();
</script>
'''

          s = re.sub(r'<style id="trekmap-ui-redesign">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'<script id="trekmap-ui-redesign-js">.*?</script>\s*', '', s, flags=re.S)
          s = s.replace('</head>', style + '\n</head>', 1)
          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Committer la nouvelle interface
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Nouvelle interface TrekMap inspiree des sites de randonnee [ui-redesign]"
          git push
