name: TrekMap UI validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Construire l'interface complète
        run: |
          python scripts/apply_ui_remodel.py
          python scripts/apply_unified_experience.py
          python scripts/finalize_unified_build.py
          python scripts/apply_mobile_experience.py
          python scripts/apply_map_polish.py
          python scripts/apply_ai_planner.py
          python scripts/apply_free_planner_labels.py
          python scripts/apply_language_learning_ui.py
          python scripts/apply_reasoning_agent_ui.py
          python scripts/apply_trekbrain_ui.py

      - name: Vérifier l'architecture frontend
        shell: python
        run: |
          from pathlib import Path
          import re

          html=Path('frontend/index.html').read_text(encoding='utf-8')
          required_ids=['app','sidebar','map','search','region-filter','difficulty-filter','distance-range','elevation-range','duration-filter','trek-list','draw-panel','gpx-file','modal-backdrop','bottom-nav']
          missing=[x for x in required_ids if f'id="{x}"' not in html]
          if missing: raise SystemExit('IDs historiques manquants: '+', '.join(missing))

          required=[
            'TREKMAP_UNIFIED_EXPERIENCE_START','trekmap-unified-css','trekmap-unified-js',
            'tm-unified-topbar','tm-main-search','tm-unified-drawer','tm-drawer-track',
            'tm-filter-toggle','tm-criteria-filters','tm-route-filter','tm-season-filter',
            'tm-rating-filter','tm-photo-filter','tm-place-filter','TrekMapOpenTrek',
            'openTrek','applyUnifiedFilters','openAdvancedUnified','tm-u-photos',
            '/catalog/criteria','/uploaded-photos','/photos','tm-map-options-panel',
            'TREKMAP_MOBILE_EXPERIENCE_START','trekmap-mobile-css','trekmap-mobile-js',
            'tm-mobile-nav','tm-mobile-create-sheet','tm-mobile-filters-open','safe-area-inset-bottom',
            'TREKMAP_MAP_POLISH_START','TREKMAP_AI_EXPERIENCE_START','trekmap-ai-js',
            'TREKMAP_LANGUAGE_UI_START','trekmap-language-js','TREKMAP_REASONING_AGENT_UI_START',
            'trekmap-reasoning-agent-js','tm-agent-clarify','/ai/clarify',
            'TREKMAP_TREKBRAIN_UI_START','trekmap-trekbrain-js','/ai/feedback','TrekBrain apprend'
          ]
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Fonctions frontend manquantes: '+', '.join(missing))

          forbidden=[
            'TREKMAP_STABLE_EXPLORER_START','TREKMAP_STABLE_REPAIRS_START',
            'TREKMAP_BOTTOM_BAR_REPAIR_START','TREKMAP_PRODUCT_UPGRADE_START',
            'TREKMAP_DISPLAY_STABILIZER_START','TREKMAP_FUNCTIONAL_REPAIRS_START',
            'TREKMAP_NAVIGATION_POLISH_START','TREKMAP_TARGET_LAYOUT_START',
            'TREKMAP_FINAL_EXPLORER_START','TREKMAP_EXPLORER_POLISH_START',
            'id="trekmap-explorer-ui"','id="trekmap-home-css"','id="trekmap-remodel-css"'
          ]
          present=[x for x in forbidden if x in html]
          if present: raise SystemExit('Anciennes couches encore présentes: '+', '.join(present))
          if html.count('TREKMAP_UNIFIED_EXPERIENCE_START')!=1: raise SystemExit('Couche unifiée dupliquée')
          if html.count('TREKMAP_MOBILE_EXPERIENCE_START')!=1: raise SystemExit('Couche mobile dupliquée')
          if html.count('TREKMAP_REASONING_AGENT_UI_START')!=1: raise SystemExit('Couche agent dupliquée')
          if html.count('TREKMAP_TREKBRAIN_UI_START')!=1: raise SystemExit('Couche TrekBrain dupliquée')

          scripts={
            'unified': re.search(r'<script id="trekmap-unified-js">(.*?)</script>',html,re.S),
            'mobile': re.search(r'<script id="trekmap-mobile-js">(.*?)</script>',html,re.S),
            'advisor': re.search(r'<script id="trekmap-ai-js">(.*?)</script>',html,re.S),
            'language': re.search(r'<script id="trekmap-language-js">(.*?)</script>',html,re.S),
            'reasoning': re.search(r'<script id="trekmap-reasoning-agent-js">(.*?)</script>',html,re.S),
            'trekbrain': re.search(r'<script id="trekmap-trekbrain-js">(.*?)</script>',html,re.S),
          }
          missing_scripts=[name for name,value in scripts.items() if not value]
          if missing_scripts: raise SystemExit('JavaScript introuvable: '+', '.join(missing_scripts))
          for name,value in scripts.items():
              Path(f'/tmp/trekmap-{name}.js').write_text(value.group(1),encoding='utf-8')
          print('Architecture TrekMap + TrekBrain v8: OK')

      - name: Vérifier les JavaScript
        run: |
          node --check /tmp/trekmap-unified.js
          node --check /tmp/trekmap-mobile.js
          node --check /tmp/trekmap-advisor.js
          node --check /tmp/trekmap-language.js
          node --check /tmp/trekmap-reasoning.js
          node --check /tmp/trekmap-trekbrain.js

      - name: Vérifier la syntaxe Python
        run: python -m compileall -q backend scripts

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier l'application et les routes
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/trekmap_ci
          TREKMAP_ENV: development
          FRONTEND_ORIGINS: http://127.0.0.1:5500,http://localhost:5500
          ORS_API_KEY: ci-placeholder
        run: |
          python - <<'PY'
          import backend.app_v5 as app_v5
          paths={r.path for r in app_v5.app.routes}
          required={'/','/health/ready','/auth/library','/catalog/criteria','/treks/{trek_id}/extras','/treks/{trek_id}/rating','/treks/{trek_id}/photos','/treks/{trek_id}/uploaded-photos','/media/trek-photos/{photo_id}','/ai/status','/ai/plan','/ai/clarify','/ai/feedback','/ai/brain'}
          missing=required-paths
          if missing: raise SystemExit('Routes manquantes: '+', '.join(sorted(missing)))
          for path in {'/','/media/trek-photos/{photo_id}','/ai/status','/ai/feedback','/ai/brain'}:
              if sum(1 for r in app_v5.app.routes if r.path==path)!=1: raise SystemExit('Route dupliquée: '+path)
          print('Backend TrekMap + TrekBrain v8: OK')
          PY
