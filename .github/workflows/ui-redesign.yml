name: TrekMap UI validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Appliquer la couche UI de production
        run: python scripts/apply_ui_remodel.py

      - name: Vérifier la structure de l'interface
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('frontend/index.html').read_text(encoding='utf-8')
          required_ids = [
              'app', 'sidebar', 'map', 'search', 'region-filter',
              'difficulty-filter', 'distance-range', 'elevation-range',
              'duration-filter', 'trek-list', 'draw-panel', 'gpx-file',
              'modal-backdrop', 'bottom-nav'
          ]
          missing = [x for x in required_ids if f'id="{x}"' not in html]
          if missing:
              raise SystemExit('IDs frontend manquants: ' + ', '.join(missing))

          for marker in ('<!DOCTYPE html>', '</html>', 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css', 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'):
              if marker not in html:
                  raise SystemExit(f'Élément frontend manquant: {marker}')

          if html.count('<html') != 1 or html.count('</html>') != 1:
              raise SystemExit('Structure HTML invalide')
          if html.count('<script>') < 1:
              raise SystemExit('JavaScript principal introuvable')

          for marker in ('/logo-trekmap.svg', 'tm-results-track', 'tm-results-handle', 'data-map-action="fit"'):
              if marker not in html:
                  raise SystemExit(f'Élément UI manquant: {marker}')

          print('Frontend TrekMap: structure OK')
          print(f'HTML: {len(html):,} caractères')

      - name: Vérifier la syntaxe Python
        run: |
          python -m compileall -q backend

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier l'import de la production
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/trekmap_ci
          TREKMAP_ENV: development
          FRONTEND_ORIGINS: http://127.0.0.1:5500,http://localhost:5500
          ORS_API_KEY: ci-placeholder
        run: python -c "import backend.main_production; print('TrekMap production import OK')"
