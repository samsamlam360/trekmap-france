name: TrekMap UI validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Construire l'interface de production
        run: |
          python scripts/apply_ui_remodel.py
          python scripts/apply_stable_explorer.py
          python scripts/apply_stable_repairs.py
          python scripts/apply_zoom_repair.py
          python scripts/apply_navigation_polish.py

      - name: Vérifier la structure et les fonctionnalités UI
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('frontend/index.html').read_text(encoding='utf-8')
          required_ids = [
              'app', 'sidebar', 'map', 'search', 'region-filter',
              'difficulty-filter', 'distance-range', 'elevation-range',
              'duration-filter', 'trek-list', 'draw-panel', 'gpx-file',
              'modal-backdrop', 'bottom-nav'
          ]
          missing = [x for x in required_ids if f'id="{x}"' not in html]
          if missing:
              raise SystemExit('IDs frontend manquants: ' + ', '.join(missing))

          markers = [
              '<!DOCTYPE html>', '</html>',
              'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css',
              'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
              'TREKMAP_STABLE_EXPLORER_START',
              'TREKMAP_STABLE_REPAIRS_START',
              'TREKMAP_NAVIGATION_POLISH_START',
              'tm-stable-topbar', 'tm-stable-search', 'tm-stable-account',
              'tm-stable-favorites', 'tm-stable-stats',
              'tm-stable-drawer', 'tm-stable-track',
              'openProfile()', "authModal('login')", "switchTab('favorites')",
              'MutationObserver', 'map.invalidateSize()',
              'data-map-action="fit"',
              'forceAllMode', "currentTab='all'",
              "visibleSearch?.addEventListener('input'",
              "e.target.closest('.tm-stable-suggestion')",
              'syncMapMenu',
              'async function zoomToTrek',
              'window.TrekMapZoomToTrek=zoomToTrek',
              'coordsFromFeatures', 'boundsFromRenderedLayer',
              "fetch(base+'/treks/'+numericId",
              "map.fitBounds(bounds.pad(.12),options)",
              "e.target.closest('.tm-stable-card')",
              "L.latLngBounds([[41.15,-5.5],[51.25,9.75]])",
              'tm-filter-section-title',
              'organizeFilters()',
              'tm-filter-collapse',
              'Importer un trek',
              'TrekMapZoomToTrek',
              'wheelTarget',
              'tm-filters-collapsed'
          ]
          missing = [x for x in markers if x not in html]
          if missing:
              raise SystemExit('Éléments UI manquants: ' + ', '.join(missing))

          forbidden = [
              'TREKMAP_TARGET_LAYOUT_START',
              'TREKMAP_FINAL_EXPLORER_START',
              'TREKMAP_EXPLORER_POLISH_START'
          ]
          present = [x for x in forbidden if x in html]
          if present:
              raise SystemExit('Anciennes couches UI encore présentes: ' + ', '.join(present))

          if html.count('<html') != 1 or html.count('</html>') != 1:
              raise SystemExit('Structure HTML invalide')
          if html.count('TREKMAP_STABLE_EXPLORER_START') != 1:
              raise SystemExit('Couche stable dupliquée')
          if html.count('TREKMAP_STABLE_REPAIRS_START') != 1:
              raise SystemExit('Couche de correctifs dupliquée')
          if html.count('TREKMAP_NAVIGATION_POLISH_START') != 1:
              raise SystemExit('Couche navigation dupliquée')

          stable = re.search(r'<script id="trekmap-stable-explorer-js">(.*?)</script>', html, re.S)
          repairs = re.search(r'<script id="trekmap-stable-repairs-js">(.*?)</script>', html, re.S)
          navigation = re.search(r'<script id="trekmap-navigation-polish-js">(.*?)</script>', html, re.S)
          if not stable or not repairs or not navigation:
              raise SystemExit('JavaScript TrekMap introuvable')
          Path('/tmp/trekmap-stable.js').write_text(stable.group(1), encoding='utf-8')
          Path('/tmp/trekmap-repairs.js').write_text(repairs.group(1), encoding='utf-8')
          Path('/tmp/trekmap-navigation.js').write_text(navigation.group(1), encoding='utf-8')

          js = repairs.group(1)
          if "currentTab='all'" not in js or "addEventListener('input'" not in js:
              raise SystemExit('Régression possible: la recherche ne réinitialise plus le contexte')
          zoom_requirements = [
              'async function zoomToTrek',
              'coordsFromFeatures',
              'boundsFromRenderedLayer',
              "fetch(base+'/treks/'+numericId",
              'map.fitBounds(bounds.pad(.12),options)',
              'window.TrekMapZoomToTrek=zoomToTrek'
          ]
          missing_zoom = [x for x in zoom_requirements if x not in js]
          if missing_zoom:
              raise SystemExit('Régression possible: zoom trek incomplet: ' + ', '.join(missing_zoom))
          if '41.15,-5.5' not in js or '51.25,9.75' not in js:
              raise SystemExit('Régression possible: le recentrage France dépend à nouveau des traces')

          nav = navigation.group(1)
          for required in ('importGPX', 'tm-filter-collapse', 'TrekMapZoomToTrek', "addEventListener('wheel'", 'wheelTarget'):
              if required not in nav:
                  raise SystemExit('Régression navigation: ' + required)

          print('Interface stable TrekMap: structure et régressions OK')
          print(f'HTML: {len(html):,} caractères')

      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check /tmp/trekmap-stable.js
          node --check /tmp/trekmap-repairs.js
          node --check /tmp/trekmap-navigation.js

      - name: Vérifier la syntaxe Python
        run: python -m compileall -q backend scripts

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier l'import de la production
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/trekmap_ci
          TREKMAP_ENV: development
          FRONTEND_ORIGINS: http://127.0.0.1:5500,http://localhost:5500
          ORS_API_KEY: ci-placeholder
        run: python -c "import backend.main_production; print('TrekMap production import OK')"
