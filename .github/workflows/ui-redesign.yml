name: TrekMap UI validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Construire l'interface unifiée
        run: |
          python scripts/apply_ui_remodel.py
          python scripts/apply_unified_experience.py

      - name: Vérifier l'architecture frontend
        shell: python
        run: |
          from pathlib import Path
          import re

          html=Path('frontend/index.html').read_text(encoding='utf-8')
          required_ids=['app','sidebar','map','search','region-filter','difficulty-filter','distance-range','elevation-range','duration-filter','trek-list','draw-panel','gpx-file','modal-backdrop','bottom-nav']
          missing=[x for x in required_ids if f'id="{x}"' not in html]
          if missing: raise SystemExit('IDs historiques manquants: '+', '.join(missing))

          required=[
            'TREKMAP_UNIFIED_EXPERIENCE_START','trekmap-unified-css','trekmap-unified-js',
            'tm-unified-topbar','tm-main-search','tm-unified-drawer','tm-drawer-track',
            'tm-filter-toggle','tm-criteria-filters','tm-route-filter','tm-season-filter',
            'tm-rating-filter','tm-photo-filter','tm-place-filter','TrekMapOpenTrek',
            'openTrek','applyUnifiedFilters','openAdvancedUnified','tm-u-photos',
            '/catalog/criteria','/uploaded-photos','/photos','tm-map-options-panel'
          ]
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Fonctions unifiées manquantes: '+', '.join(missing))

          forbidden=[
            'TREKMAP_STABLE_EXPLORER_START','TREKMAP_STABLE_REPAIRS_START',
            'TREKMAP_BOTTOM_BAR_REPAIR_START','TREKMAP_PRODUCT_UPGRADE_START',
            'TREKMAP_DISPLAY_STABILIZER_START','TREKMAP_FUNCTIONAL_REPAIRS_START',
            'TREKMAP_NAVIGATION_POLISH_START','TREKMAP_TARGET_LAYOUT_START',
            'TREKMAP_FINAL_EXPLORER_START','TREKMAP_EXPLORER_POLISH_START',
            'id="trekmap-explorer-ui"','id="trekmap-home-css"','id="trekmap-remodel-css"'
          ]
          present=[x for x in forbidden if x in html]
          if present: raise SystemExit('Anciennes couches encore présentes: '+', '.join(present))
          if html.count('TREKMAP_UNIFIED_EXPERIENCE_START')!=1: raise SystemExit('Couche unifiée dupliquée')
          if html.count("drawer.id='tm-unified-drawer'")!=1: raise SystemExit('Création du tiroir dupliquée')
          if html.count("top.id='tm-unified-topbar'")!=1: raise SystemExit('Création de la barre supérieure dupliquée')

          m=re.search(r'<script id="trekmap-unified-js">(.*?)</script>',html,re.S)
          if not m: raise SystemExit('JavaScript unifié introuvable')
          Path('/tmp/trekmap-unified.js').write_text(m.group(1),encoding='utf-8')
          print('Architecture TrekMap unifiée: OK')

      - name: Vérifier le JavaScript unifié
        run: node --check /tmp/trekmap-unified.js

      - name: Vérifier la syntaxe Python
        run: python -m compileall -q backend scripts

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier l'application et les routes
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/trekmap_ci
          TREKMAP_ENV: development
          FRONTEND_ORIGINS: http://127.0.0.1:5500,http://localhost:5500
          ORS_API_KEY: ci-placeholder
        run: |
          python - <<'PY'
          import backend.app_v5 as app_v5
          paths={r.path for r in app_v5.app.routes}
          required={'/','/health/ready','/auth/library','/catalog/criteria','/treks/{trek_id}/extras','/treks/{trek_id}/rating','/treks/{trek_id}/photos','/treks/{trek_id}/uploaded-photos','/media/trek-photos/{photo_id}'}
          missing=required-paths
          if missing: raise SystemExit('Routes manquantes: '+', '.join(sorted(missing)))
          if sum(1 for r in app_v5.app.routes if r.path=='/')!=1: raise SystemExit('Route / dupliquée')
          if sum(1 for r in app_v5.app.routes if r.path=='/media/trek-photos/{photo_id}')!=1: raise SystemExit('Route photo dupliquée')
          print('Backend TrekMap unifié: OK')
          PY
