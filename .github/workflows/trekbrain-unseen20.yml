name: TrekBrain 20 unseen regions audit

on:
  # Live routing is manual; the weekly serial suite also includes these cases.
  # Application pushes must not trigger twenty public routing requests.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trekbrain-unseen20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unseen-regions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout scenarios
        uses: actions/checkout@v4
      - name: Verify twenty unseen prompts
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import benchmark_trekbrain_v9_unseen20 as unseen
          assert len(unseen.SCENARIOS) == 20
          assert len({x['region'] for x in unseen.SCENARIOS}) == 20
          print('20 novel, distinct-region test prompts: OK')
          PY
      - name: Wait for exact deployed commit
        shell: python
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://trekmap-france.onrender.com
        run: |
          import json, os, time, urllib.request
          expected = os.environ['EXPECTED_SHA'].lower()
          for attempt in range(36):
              try:
                  req = urllib.request.Request(os.environ['BASE_URL']+'/ai/status',headers={'User-Agent':'TrekBrain-unseen20/1.0'})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      data = json.load(response)
                  if str(data.get('build_commit') or '').lower() == expected:
                      print('Deployed commit verified',expected[:12])
                      break
              except Exception as exc:
                  print('Pending deployed build',type(exc).__name__,str(exc)[:120])
              time.sleep(10)
          else:
              raise SystemExit('Render did not deploy the expected commit')
      - name: Benchmark twenty independent real production requests
        env:
          EXPECTED_SHA: ${{ github.sha }}
          TREKBRAIN_BENCHMARK_URL: https://trekmap-france.onrender.com
          TREKBRAIN_BENCHMARK_OUT: benchmark-results-20
        run: python scripts/benchmark_trekbrain_v9_unseen20.py
      - name: Publish all successes and failures
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          report=Path('benchmark-results-20/trekbrain-production-benchmark.md')
          text=report.read_text(encoding='utf-8') if report.exists() else 'Audit non exécuté : consulter les étapes en échec.\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as summary:
              summary.write(text)
      - name: Preserve full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trekbrain-unseen20-audit
          path: benchmark-results-20/
          if-no-files-found: ignore
          retention-days: 14
