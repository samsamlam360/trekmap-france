name: IGN named-place API contract probe (one shot)
on:
  push:
    branches: [fix-cold-natural-geocoding-20261013]
    paths:
      - .github/workflows/ign-natural-poi-probe-once.yml
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe IGN POI search schema (bounded, no secrets)
        shell: python
        run: |
          import json,urllib.request,urllib.parse,urllib.error
          base='https://data.geopf.fr/geocodage/'
          tests=[
            ('completion/',{'text':'Lac Blanc','type':'PositionOfInterest','maximumResponses':'3'}),
            ('search',{'q':'Cascades du Hérisson','limit':'3','index':'poi'}),
            ('search',{'q':'Lac Blanc','limit':'4','index':'poi','depcode':'68'}),
            ('search',{'q':'Cascades du Hérisson','limit':'3','index':'poi','depcode':'39'}),
            ('../departements',{'nom':'Haut-Rhin','fields':'nom,code','format':'json'}),
          ]
          for endpoint,params in tests:
              url=(('https://geo.api.gouv.fr/departements') if endpoint=='../departements' else base+endpoint)+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':'TrekMapFrance-generic-geocoder-evaluation/1'})
              try:
                  with urllib.request.urlopen(req,timeout=7) as res:
                      obj=json.load(res)
                  print(endpoint,'params=',params,'type=',type(obj).__name__, 'keys=',list(obj)[:8] if isinstance(obj,dict) else '')
                  rows=(obj.get('results') or obj.get('features') or obj.get('suggestions') or []) if isinstance(obj,dict) else (obj if isinstance(obj,list) else [])
                  for row in rows[:3]:
                      print('  sample=',str(row)[:1400])
              except Exception as exc:
                  print(endpoint,'unavailable',type(exc).__name__,str(exc)[:200])
