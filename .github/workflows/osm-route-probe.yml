name: Probe ODbL regional long hikes
on:
  push:
    branches: ["feat/nationwide-long-trek-*"]
    paths: ["scripts/probe_osm_region_routes.py", ".github/workflows/osm-route-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/probe_osm_region_routes.py
      - name: Save separate ODbL trail survey
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm_region_route_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: ODbL route research across uncovered regions"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
