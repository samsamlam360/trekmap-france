name: One-off TrekBrain missing-day food cold benchmark
on:
  pull_request:
    paths:
      - '.github/workflows/trekbrain-phase1-food-cold-20261017.yml'
permissions:
  contents: read
concurrency:
  group: one-off-trekbrain-food-cold-20261017
  cancel-in-progress: false
jobs:
  audited-real:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      EXPECTED_SHA: bcf33eb7fb55764928f7cda4d339fbc3b18a582d
      TREKBRAIN_BENCHMARK_URL: https://trekmap-france.onrender.com
      TREKBRAIN_BENCHMARK_MIN_INTERVAL_SECONDS: '18'
    steps:
      - uses: actions/checkout@v4
      - name: Refuse wrong Render revision
        shell: python
        run: |
          import os,time,urllib.request,json
          for _ in range(45):
              try:
                  with urllib.request.urlopen('https://trekmap-france.onrender.com/ai/status', timeout=20) as resp:
                      body=json.load(resp)
                  live=str(body.get('build_commit','')).lower()
                  if live==os.environ['EXPECTED_SHA'].lower():
                      print('Benchmark LIVE commit',live,flush=True);break
                  print('Different live commit',live,flush=True)
              except Exception as error:
                  print(type(error).__name__,str(error)[:200],flush=True)
              time.sleep(10)
          else:
              raise SystemExit('Cannot benchmark a different production build')
      - name: Five previously unbenchmarked regions, with genuine cache-miss telemetry
        shell: python
        continue-on-error: true
        env:
          TREKBRAIN_BENCHMARK_OUT: results-new-regions
        run: |
          import os,sys
          sys.path.insert(0,'scripts')
          import benchmark_trekbrain_v9_production as core
          candidates=[
            ('epernay-marne','Épernay, Marne',2,15,
             'Prépare une randonnée de deux jours en boucle depuis Épernay, environ 15 km par jour avec hébergement accessible à pied, eau potable et commerces.'),
            ('ancenis-loire-atlantique','Ancenis-Saint-Géréon, Loire-Atlantique',2,16,
             'Trouve une boucle pédestre de deux jours depuis Ancenis-Saint-Géréon, 16 km par jour avec camping, fontaines potables et ravitaillement.'),
            ('sancerre-cher','Sancerre, Cher',3,14,
             'Propose un trek en boucle de trois jours au départ de Sancerre, 14 km par jour avec gîtes, eau potable et commerces.'),
            ('millau-aveyron','Millau, Aveyron',2,16,
             'Je souhaite une boucle de deux jours depuis Millau dans l’Aveyron, 16 km par jour, camping, commerces et eau potable sur chaque journée.'),
            ('lons-jura','Lons-le-Saunier, Jura',2,15,
             'Prépare une randonnée de deux jours en boucle depuis Lons-le-Saunier, 15 km par jour avec gîte à pied, eau potable et ravitaillement.'),
          ]
          core.SCENARIOS=[{
             'id':sid,'prompt':prompt,'region':region,'days':days,'daily_km':km,
             'difficulty':'medium','route_type':'Boucle',
             'require_transit':False,'require_water':True,
             'require_accommodation':True,'require_food':True,
             'expect_type':'boucle','expect_close':True,
          } for sid,region,days,km,prompt in candidates]
          core.OUT_DIR=core.Path(os.environ['TREKBRAIN_BENCHMARK_OUT'])
          core.OUT_DIR.mkdir(parents=True,exist_ok=True)
          core.main()
      - name: Ten identical previous benchmark prompts for comparable before-after
        shell: python
        continue-on-error: true
        env:
          TREKBRAIN_BENCHMARK_OUT: results-repeat-ten
        run: |
          import os,sys
          sys.path.insert(0,'scripts')
          import benchmark_trekbrain_v9_unseen20 as unseen
          import benchmark_trekbrain_v9_production as core
          ids=['cote-granit-rose','sarlat-dordogne','florac-cevennes','luberon-bonnieux',
               'etretat-pays-caux','lac-blanc-vosges','nasbinals-aubrac',
               'chartreuse-saint-pierre','cauterets-pont-espagne','riquewihr-vosges']
          rows={row['id']:row for row in unseen.SCENARIOS}
          assert len(ids)==len(set(ids))==10 and all(key in rows for key in ids)
          core.SCENARIOS=[rows[key] for key in ids]
          core.OUT_DIR=core.Path(os.environ['TREKBRAIN_BENCHMARK_OUT'])
          core.OUT_DIR.mkdir(parents=True,exist_ok=True)
          core.main()
      - name: Save complete results even when readiness checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trekbrain-phase1-food-cold-15
          path: |
            results-new-regions/
            results-repeat-ten/
          if-no-files-found: warn
          retention-days: 14
      - name: Print independent summaries and cold-cache evidence
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import os,json
          summaries=[]
          for name in ['results-new-regions','results-repeat-ten']:
              base=Path(name)
              report=base/'trekbrain-production-benchmark.md'
              summary=report.read_text(encoding='utf-8') if report.exists() else f'MISSING REPORT {name}'
              print(summary)
              datafile=base/'trekbrain-production-benchmark.json'
              if datafile.exists():
                  data=json.loads(datafile.read_text(encoding='utf-8'))
                  for row in data.get('scenarios',[]):
                      print('CACHE VERIFICATION',row['id'],
                            'status=',row.get('osm_cache_status'),
                            'hits=',row.get('osm_cache_hits'),
                            'cold=',row.get('cold_cache'),
                            'nights_walk=',row.get('nights_walk_confirmed'),
                            'water_referenced=',row.get('water_potable_referenced'),
                            flush=True)
              summaries.append('## '+name+'\n'+summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('\n\n'.join(summaries))
