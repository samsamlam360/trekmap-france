name: TrekBrain v9 checks

on:
  push:
    branches: [main, trekbrain-v9-stabilization]
  pull_request:

jobs:
  v9-check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/trekmap_ci
      TREKMAP_ENV: development
      FRONTEND_ORIGINS: http://127.0.0.1:5500,http://localhost:5500
      ORS_API_KEY: ci-placeholder
      TREKBRAIN_VERSION: v9
      TREKBRAIN_FREE_MODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q backend scripts
      - name: Import active app
        run: python -c "import backend.app_v5 as app; assert app.TREKBRAIN_VERSION == 'v9'; print('TrekBrain v9 import OK')"
      - name: Check v9 endpoints
        run: |
          python - <<'PY'
          import backend.app_v5 as app_v5
          paths=[r.path for r in app_v5.app.routes]
          required={'/ai/status','/ai/plan','/ai/clarify','/ai/feedback','/ai/brain','/ai/ask','/treks/{trek_id}/ai-redraw'}
          missing=required-set(paths)
          if missing: raise SystemExit('Missing endpoints: '+', '.join(sorted(missing)))
          for path in required:
              if paths.count(path)!=1: raise SystemExit(f'Duplicate endpoint: {path} ({paths.count(path)})')
          print('TrekBrain v9.1 endpoints: OK')
          PY
      - name: Precision tests
        run: python scripts/test_trekbrain_v9.py
      - name: GR corridor regressions
        run: python scripts/test_trekbrain_v9_gr.py
      - name: Multi-trail path-network regressions
        run: python scripts/test_trekbrain_v9_network.py
      - name: Matrix-first constraint regressions
        run: python scripts/test_trekbrain_v9_matrix.py
      - name: Daily mileage tolerance regressions
        run: python scripts/test_trekbrain_v9_distance_tolerance.py
      - name: Planner recovery regressions
        run: python scripts/test_trekbrain_v9_recovery.py
      - name: Adaptive campsite recovery regression
        run: python scripts/test_trekbrain_v9_roundtrip_camping.py
      - name: Campsite-aware alternate loop regression
        run: python scripts/test_trekbrain_v9_campsite_loop.py
      - name: Campsite lookup rescue regression
        run: python scripts/test_trekbrain_v9_stays_rescue.py
      - name: Display-only water regression
        run: python scripts/test_trekbrain_v9_water_display.py
      - name: Interactive latency regressions
        run: python scripts/test_trekbrain_v9_speed.py
      - name: Timeout circuit breaker regression
        run: python scripts/test_trekbrain_v9_circuit_breaker.py
      - name: Route resource tests
        run: python scripts/test_trekbrain_v9_resources.py
      - name: V8 and French language regressions
        run: |
          python scripts/test_trekbrain_v8.py
          python scripts/test_language_v6.py
      - name: Free mode, research and dialogue regressions
        run: python scripts/test_trekbrain_v9_extended.py
      - name: UI stability and dialogue
        run: node scripts/test_trekbrain_v9_ui.mjs
      - name: Build production frontend
        run: |
          python scripts/apply_ui_remodel.py
          python scripts/apply_unified_experience.py
          python scripts/finalize_unified_build.py
          python scripts/apply_mobile_experience.py
          python scripts/apply_map_polish.py
          python scripts/apply_ai_planner.py
          python scripts/apply_free_planner_labels.py
          python scripts/apply_language_learning_ui.py
          python scripts/apply_reasoning_agent_ui.py
          python scripts/apply_trekbrain_ui.py
          python scripts/apply_selected_trekbrain_ui.py
          python scripts/apply_route_day_visuals.py
      - name: Check v9 frontend
        shell: python
        run: |
          from pathlib import Path
          import re
          html=Path('frontend/index.html').read_text(encoding='utf-8')
          required=[
            'TREKMAP_TREKBRAIN_V9_UI_START','trekmap-trekbrain-v9-js','Décision TrekBrain',
            'Confirmé','À vérifier','Important','/ai/feedback',
            'TREKMAP_TREKBRAIN_V91_MAP_START','trekmap-trekbrain-v91-map-js',
            'Repères TrekBrain','ai-redraw','Mettre à jour ce trek dans TrekMap',
            'TREKMAP_ROUTE_DAY_VISUALS_START','trekmap-route-day-visuals-js',
            'Étapes du trek','Départ','Arrivée','Jour ${i+1}'
          ]
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing V9.1 UI: '+', '.join(missing))
          if 'TREKMAP_TREKBRAIN_UI_START' in html: raise SystemExit('Old V8 TrekBrain UI was not replaced')
          if html.count('TREKMAP_TREKBRAIN_V9_UI_START')!=1: raise SystemExit('V9 UI duplicated')
          if html.count('TREKMAP_TREKBRAIN_V91_MAP_START')!=1: raise SystemExit('V9.1 map UI duplicated')
          if html.count('TREKMAP_ROUTE_DAY_VISUALS_START')!=1: raise SystemExit('Daily route visuals duplicated')
          scripts={
              'v9':'trekmap-trekbrain-v9-js',
              'v91-map':'trekmap-trekbrain-v91-map-js',
              'route-days':'trekmap-route-day-visuals-js',
          }
          for name,sid in scripts.items():
              m=re.search(r'<script id="'+re.escape(sid)+r'">(.*?)</script>',html,re.S)
              if not m: raise SystemExit('JavaScript missing: '+sid)
              Path('/tmp/trekbrain-'+name+'.js').write_text(m.group(1),encoding='utf-8')
          print('TrekBrain v9.1 frontend + daily route visuals: OK')
      - name: Check v9 JavaScript
        run: |
          node --check /tmp/trekbrain-v9.js
          node --check /tmp/trekbrain-v91-map.js
          node --check /tmp/trekbrain-route-days.js
      - name: Check inherited research panel stability
        run: node scripts/test_trekbrain_v9_ui.mjs frontend/index.html
