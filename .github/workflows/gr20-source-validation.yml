name: Verify source-attributed ODbL GR20 GPS
on:
  push:
    branches: ["feat/nationwide-long-trek-*"]
    paths: ["scripts/prepare_gr20_open.py", ".github/workflows/gr20-source-validation.yml"]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/prepare_gr20_open.py
      - name: Commit separately ODbL-licensed hiking data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gr20_osm_open.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: stage source-attributed Corsican GR20 ODbL trace"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
