name: TrekMap Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
      - 'scripts/test_android_scaffold.mjs'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
      - 'scripts/test_android_scaffold.mjs'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check TrekMap Android integration
        run: node scripts/test_android_scaffold.mjs
      - name: Install locked top-level Capacitor versions
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Generate native Android project
        working-directory: mobile
        run: npx cap add android
      - name: Increment Android version
        run: echo "TREKMAP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Add native GPS permissions and branding
        working-directory: mobile
        run: node scripts/configure-android.mjs
      - name: Synchronize Capacitor Android
        working-directory: mobile
        run: npx cap sync android
      - name: Validate generated Android project
        working-directory: mobile
        run: node scripts/verify-android.mjs
      - name: Build installable APK (debug signing; test only)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: trekmap-france-android-debug-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Configure persistent Android signing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TREKMAP_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TREKMAP_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TREKMAP_ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TREKMAP_ANDROID_KEY_ALIAS }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "Private signing secrets not configured: only debug APK generated."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/trekmap-signing.jks"
          echo "TREKMAP_KEYSTORE_PATH=$RUNNER_TEMP/trekmap-signing.jks" >> "$GITHUB_ENV"
          echo "TREKMAP_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TREKMAP_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "TREKMAP_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TREKMAP_RELEASE_ENABLED=1" >> "$GITHUB_ENV"
      - name: Build stable signed APK
        if: env.TREKMAP_RELEASE_ENABLED == '1'
        working-directory: mobile/android
        shell: bash
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          verifier="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          test -x "$verifier"
          "$verifier" verify "$apk"
          cp "$apk" "$RUNNER_TEMP/trekmap-france.apk"
      - name: Publish stable signed update
        if: env.TREKMAP_RELEASE_ENABLED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "android-v$TREKMAP_VERSION_CODE" "$RUNNER_TEMP/trekmap-france.apk" \
            --title "TrekMap Android $TREKMAP_VERSION_CODE" \
            --notes "Version Android signée, à installer sans désinstaller la version précédente possédant la même signature." \
            --latest
