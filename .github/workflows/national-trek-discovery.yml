name: Discover nationwide open hiking sources
on:
  push:
    branches: ["feat/nationwide-long-trek-*"]
    paths: ["scripts/discover_national_trek_sources.py", ".github/workflows/national-trek-discovery.yml"]
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/discover_national_trek_sources.py
      - name: Save source audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national_trek_source_survey.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: survey 13-region open hiking data providers"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
