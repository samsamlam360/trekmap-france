name: TrekMap automatic incident triage

# Respond to failed production checks only. No synthetic trekking requests,
# no billing changes, no Render deploy keys, no write access to source code.
on:
  workflow_run:
    workflows:
      - TrekMap production smoke
      - TrekMap nightly health
      - TrekBrain serial production suite
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: trekmap-auto-triage
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Retry free-host readiness and record reproducible incident
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/trekmap_auto_triage.py
