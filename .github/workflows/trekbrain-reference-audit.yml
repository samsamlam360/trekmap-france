name: TrekBrain reference benchmark (one pass)

on:
  push:
    branches:
      - audit/trekbrain-reference-20261020

permissions:
  contents: read

concurrency:
  group: trekbrain-reference-audit-20261020
  cancel-in-progress: true

jobs:
  benchmark:
    name: Six reference treks against current production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout benchmark scripts
        uses: actions/checkout@v4

      - name: Wait for the exact current production build
        shell: python
        env:
          EXPECTED_PRODUCTION_SHA: f5190b610a6e2b1d7f0aa8e907fce44518995f0f
          BASE_URL: https://trekmap-france.onrender.com
        run: |
          import json, os, time, urllib.request
          expected = os.environ["EXPECTED_PRODUCTION_SHA"].lower()
          base = os.environ["BASE_URL"].rstrip("/")
          last = "not checked"
          for attempt in range(1, 37):
              try:
                  req = urllib.request.Request(
                      base + "/ai/status",
                      headers={"User-Agent": "TrekBrain-reference-audit/1.0"},
                  )
                  with urllib.request.urlopen(req, timeout=20) as response:
                      payload = json.load(response)
                  build = str(payload.get("build_commit") or "").lower()
                  last = f"build={build[:12]} channel={payload.get('release_channel')}"
                  if build == expected:
                      print("Exact production build confirmed:", build)
                      break
              except Exception as exc:
                  last = f"{type(exc).__name__}: {exc}"
              print(f"wait {attempt}/36: {last}", flush=True)
              time.sleep(10)
          else:
              raise SystemExit("Production build mismatch or unavailable: " + last)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install benchmark dependencies
        run: python -m pip install requests

      - name: Run the six reference treks once
        env:
          EXPECTED_SHA: f5190b610a6e2b1d7f0aa8e907fce44518995f0f
          TREKBRAIN_BENCHMARK_URL: https://trekmap-france.onrender.com
          TREKBRAIN_BENCHMARK_OUT: benchmark-results-reference
          TREKBRAIN_BENCHMARK_MIN_INTERVAL_SECONDS: "20"
        run: python scripts/benchmark_trekbrain_v9_production.py

      - name: Publish benchmark report in the run summary
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          report = Path("benchmark-results-reference/trekbrain-production-benchmark.md")
          text = report.read_text(encoding="utf-8") if report.exists() else "Benchmark report unavailable; inspect the failed step logs.\\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(text)

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trekbrain-reference-benchmark-20261020
          path: benchmark-results-reference/
          if-no-files-found: ignore
          retention-days: 14
