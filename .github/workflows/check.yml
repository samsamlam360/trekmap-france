name: TrekMap checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/trekmap_ci
      TREKMAP_ENV: development
      FRONTEND_ORIGINS: http://127.0.0.1:5500,http://localhost:5500
      ORS_API_KEY: ci-placeholder
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier la syntaxe Python
        run: python -m compileall -q backend

      - name: Vérifier l'import de l'application
        run: python -c "import backend.main_production; print('TrekMap production import OK')"

      - name: Vérifier le frontend
        shell: python
        run: |
          from pathlib import Path

          html = Path('frontend/index.html').read_text(encoding='utf-8')
          required_ids = [
              'app', 'sidebar', 'map', 'search', 'region-filter',
              'difficulty-filter', 'distance-range', 'elevation-range',
              'duration-filter', 'trek-list', 'draw-panel', 'gpx-file',
              'modal-backdrop', 'bottom-nav'
          ]
          missing = [x for x in required_ids if f'id="{x}"' not in html]
          if missing:
              raise SystemExit('IDs frontend manquants: ' + ', '.join(missing))

          required_markers = [
              '<!DOCTYPE html>', '</html>',
              'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css',
              'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
              'function openDetail(', 'function importGPX(',
              'function startDrawing(', 'function exportGPX('
          ]
          missing = [x for x in required_markers if x not in html]
          if missing:
              raise SystemExit('Éléments frontend manquants: ' + ', '.join(missing))

          if html.count('<html') != 1 or html.count('</html>') != 1:
              raise SystemExit('Structure HTML invalide')
          if html.count('id="trekmap-ui-redesign"') > 1:
              raise SystemExit('La couche UI redesign est dupliquée')

          print('Frontend TrekMap: structure et fonctions principales OK')
