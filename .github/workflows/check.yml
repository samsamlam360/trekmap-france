name: TrekMap checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/trekmap_ci
      TREKMAP_ENV: development
      FRONTEND_ORIGINS: http://127.0.0.1:5500,http://localhost:5500
      ORS_API_KEY: ci-placeholder
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Vérifier la syntaxe Python
        run: python -m compileall -q backend scripts
      - name: Vérifier l'import de l'application 5.0
        run: python -c "import backend.app_v5; print('TrekMap 5.0 import OK')"
      - name: Construire le frontend de production
        run: |
          python scripts/apply_ui_remodel.py
          python scripts/apply_stable_explorer.py
          python scripts/apply_stable_repairs.py
          python scripts/apply_zoom_repair.py
          python scripts/apply_bottom_bar_repair.py
          python scripts/apply_product_upgrade.py
          python scripts/apply_display_stabilizer.py
      - name: Vérifier le frontend construit
        shell: python
        run: |
          from pathlib import Path
          import re
          html = Path('frontend/index.html').read_text(encoding='utf-8')
          required_ids = ['app','sidebar','map','search','region-filter','difficulty-filter','distance-range','elevation-range','duration-filter','trek-list','draw-panel','gpx-file','modal-backdrop','bottom-nav']
          missing = [x for x in required_ids if f'id="{x}"' not in html]
          if missing: raise SystemExit('IDs frontend manquants: ' + ', '.join(missing))
          required_markers = ['<!DOCTYPE html>','</html>','TREKMAP_DISPLAY_STABILIZER_START','trekmap-display-stabilizer-js','function openDetail(','function importGPX(','function startDrawing(','function exportGPX(']
          missing = [x for x in required_markers if x not in html]
          if missing: raise SystemExit('Éléments frontend manquants: ' + ', '.join(missing))
          if 'TREKMAP_NAVIGATION_POLISH_START' in html: raise SystemExit('Ancienne couche navigation encore présente')
          if 'Le clic sur une carte de trek sert maintenant à la localiser sur la carte.' in html: raise SystemExit('Ancien listener du tiroir encore présent')
          if html.count('<html') != 1 or html.count('</html>') != 1: raise SystemExit('Structure HTML invalide')
          scripts = re.findall(r'<script id="(trekmap-[^"]+-js)">(.*?)</script>', html, re.S)
          for name, source in scripts:
              Path('/tmp/'+name+'.js').write_text(source,encoding='utf-8')
          print('Frontend TrekMap final: structure et couches OK')
      - name: Vérifier le JavaScript généré
        shell: bash
        run: |
          set -euo pipefail
          for f in /tmp/trekmap-*-js.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
          echo "JavaScript généré: OK"

  production-smoke:
    runs-on: ubuntu-latest
    needs: quality-check
    steps:
      - name: Vérifier la page publique Render
        shell: bash
        run: |
          set -euo pipefail
          base="https://trekmap-france.onrender.com"
          curl --fail --silent --show-error --max-time 45 "$base/" -o /tmp/trekmap.html
          grep -q '<!DOCTYPE html>' /tmp/trekmap.html
          grep -q 'TrekMap' /tmp/trekmap.html
          grep -q 'id="map"' /tmp/trekmap.html
          echo "Page publique Render: OK"
      - name: Vérifier la santé de l'API
        shell: bash
        run: |
          set -euo pipefail
          base="https://trekmap-france.onrender.com"
          health="$(curl --fail --silent --show-error --max-time 45 "$base/health/ready")"
          echo "$health"
          echo "$health" | grep -Eiq 'ok|degraded|status'
          echo "Endpoint /health/ready: OK"
      - name: Vérifier l'API des treks
        shell: bash
        run: |
          set -euo pipefail
          base="https://trekmap-france.onrender.com"
          curl --fail --silent --show-error --max-time 45 "$base/treks" -o /tmp/treks.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/treks.json').read_text(encoding='utf-8'))
          if not isinstance(data, list):
              raise SystemExit('/treks ne renvoie pas une liste JSON')
          print(f'/treks: OK ({len(data)} trek(s) accessible(s))')
          PY
      - name: Vérifier les ressources statiques essentielles
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' -o /dev/null
          curl --fail --silent --show-error --max-time 30 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js' -o /dev/null
          echo "Ressources Leaflet: OK"
