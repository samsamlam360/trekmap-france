name: TrekMap checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/trekmap_ci
      TREKMAP_ENV: development
      FRONTEND_ORIGINS: http://127.0.0.1:5500,http://localhost:5500
      ORS_API_KEY: ci-placeholder
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Vérifier la syntaxe Python
        run: python -m compileall -q backend scripts
      - name: Vérifier l'import de l'application
        run: python -c "import backend.app_v5; print('TrekMap language planner import OK')"
      - name: Vérifier la compréhension du français
        shell: bash
        run: |
          python - <<'PY'
          from backend.language_engine import normalize_for_planner
          text,matches=normalize_for_planner('Je veux trois jours pépère, 15 bornes par jour, sans bagnole et de beaux spots')
          expected=['3 jours','facile','15 km','train','panorama']
          missing=[x for x in expected if x not in text]
          if missing: raise SystemExit('Compréhension linguistique incomplète: '+', '.join(missing)+' | '+text)
          custom,_=normalize_for_planner('Je veux un trek pépouze', [{'phrase':'pépouze','meaning':'facile max 12 km par jour'}])
          if 'facile' not in custom or '12 km' not in custom: raise SystemExit('Règle personnelle non appliquée: '+custom)
          print('Compréhension française + vocabulaire personnel: OK')
          PY
      - name: Construire le frontend complet
        run: |
          python scripts/apply_ui_remodel.py
          python scripts/apply_unified_experience.py
          python scripts/finalize_unified_build.py
          python scripts/apply_mobile_experience.py
          python scripts/apply_map_polish.py
          python scripts/apply_ai_planner.py
          python scripts/apply_free_planner_labels.py
          python scripts/apply_language_learning_ui.py
      - name: Vérifier le frontend construit
        shell: python
        run: |
          from pathlib import Path
          import re
          html=Path('frontend/index.html').read_text(encoding='utf-8')
          required=['<!DOCTYPE html>','</html>','TREKMAP_UNIFIED_EXPERIENCE_START','trekmap-unified-css','trekmap-unified-js','tm-unified-topbar','tm-unified-drawer','TREKMAP_MOBILE_EXPERIENCE_START','trekmap-mobile-css','trekmap-mobile-js','tm-mobile-nav','tm-mobile-create-sheet','TREKMAP_MAP_POLISH_START','TREKMAP_AI_EXPERIENCE_START','trekmap-ai-js','TREKMAP_LANGUAGE_UI_START','trekmap-language-js','tm-language-learn','Apprendre mon vocabulaire','Conseiller TrekMap','Ce que j’ai compris','Pourquoi je te conseille ce trek','function openDetail(','function startDrawing(','function exportGPX(']
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Éléments frontend manquants: '+', '.join(missing))
          forbidden=['TREKMAP_STABLE_EXPLORER_START','TREKMAP_STABLE_REPAIRS_START','TREKMAP_BOTTOM_BAR_REPAIR_START','TREKMAP_PRODUCT_UPGRADE_START','TREKMAP_DISPLAY_STABILIZER_START','TREKMAP_FUNCTIONAL_REPAIRS_START','TREKMAP_NAVIGATION_POLISH_START','id="trekmap-explorer-ui"']
          present=[x for x in forbidden if x in html]
          if present: raise SystemExit('Anciennes couches présentes: '+', '.join(present))
          if html.count('<html')!=1 or html.count('</html>')!=1: raise SystemExit('Structure HTML invalide')
          unified=re.search(r'<script id="trekmap-unified-js">(.*?)</script>',html,re.S)
          mobile=re.search(r'<script id="trekmap-mobile-js">(.*?)</script>',html,re.S)
          advisor=re.search(r'<script id="trekmap-ai-js">(.*?)</script>',html,re.S)
          language=re.search(r'<script id="trekmap-language-js">(.*?)</script>',html,re.S)
          if not unified or not mobile or not advisor or not language: raise SystemExit('Un script frontend est introuvable')
          Path('/tmp/trekmap-unified.js').write_text(unified.group(1),encoding='utf-8')
          Path('/tmp/trekmap-mobile.js').write_text(mobile.group(1),encoding='utf-8')
          Path('/tmp/trekmap-advisor.js').write_text(advisor.group(1),encoding='utf-8')
          Path('/tmp/trekmap-language.js').write_text(language.group(1),encoding='utf-8')
          print('Frontend TrekMap complet + langage adaptatif: OK')
      - name: Vérifier le JavaScript
        run: |
          node --check /tmp/trekmap-unified.js
          node --check /tmp/trekmap-mobile.js
          node --check /tmp/trekmap-advisor.js
          node --check /tmp/trekmap-language.js

  production-smoke:
    runs-on: ubuntu-latest
    needs: quality-check
    steps:
      - name: Vérifier la page publique Render
        shell: bash
        run: |
          set -euo pipefail
          base="https://trekmap-france.onrender.com"
          curl --fail --silent --show-error --max-time 45 "$base/" -o /tmp/trekmap.html
          grep -q '<!DOCTYPE html>' /tmp/trekmap.html
          grep -q 'TrekMap' /tmp/trekmap.html
          grep -q 'id="map"' /tmp/trekmap.html
          echo "Page publique Render: OK"
      - name: Vérifier la santé de l'API
        shell: bash
        run: |
          set -euo pipefail
          base="https://trekmap-france.onrender.com"
          health="$(curl --fail --silent --show-error --max-time 45 "$base/health/ready")"
          echo "$health"
          echo "$health" | grep -Eiq 'ok|degraded|status'
          echo "Endpoint /health/ready: OK"
      - name: Vérifier l'API des treks
        shell: bash
        run: |
          set -euo pipefail
          base="https://trekmap-france.onrender.com"
          curl --fail --silent --show-error --max-time 45 "$base/treks" -o /tmp/treks.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/treks.json').read_text(encoding='utf-8'))
          if not isinstance(data,list): raise SystemExit('/treks ne renvoie pas une liste JSON')
          print(f'/treks: OK ({len(data)} trek(s))')
          PY
      - name: Vérifier les ressources Leaflet
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' -o /dev/null
          curl --fail --silent --show-error --max-time 30 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js' -o /dev/null
          echo "Leaflet: OK"
