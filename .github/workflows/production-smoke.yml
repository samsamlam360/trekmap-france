name: TrekMap production smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trekmap-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Verify deployed main commit
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Wait for Render to publish this exact commit
        shell: python
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://trekmap-france.onrender.com
        run: |
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          expected = os.environ["EXPECTED_SHA"].strip().lower()
          base = os.environ["BASE_URL"].rstrip("/")
          last = "aucune réponse"

          for attempt in range(1, 31):
              try:
                  req = urllib.request.Request(
                      base + "/ai/status",
                      headers={"User-Agent": "TrekMap-production-smoke/1.0"},
                  )
                  with urllib.request.urlopen(req, timeout=20) as response:
                      payload = json.load(response)
                  build = str(payload.get("build_commit") or "").strip().lower()
                  channel = payload.get("release_channel")
                  pipeline = str(payload.get("pipeline_version") or "")
                  last = f"HTTP 200 build={build[:10] or '?'} channel={channel} pipeline={pipeline}"
                  if build == expected:
                      print(f"Render sert le commit attendu après {attempt} tentative(s): {build[:10]}")
                      break
              except Exception as exc:
                  last = f"{type(exc).__name__}: {exc}"
              print(f"Tentative {attempt}/30: {last}")
              time.sleep(10)
          else:
              raise SystemExit(
                  "Render n'a pas publié le commit attendu dans la fenêtre de contrôle. "
                  f"Attendu={expected[:10]}, dernier état={last}"
              )

          assert payload.get("release_channel") == "v9-stable", payload
          assert payload.get("stability_gate") == "required", payload
          assert payload.get("golden_prompt_count") == 5, payload
          assert payload.get("field_scenario_count") == 40, payload
          assert payload.get("field_suite") == "required", payload
          assert pipeline.startswith("v9-explicit-"), payload

      - name: Smoke public production endpoints
        shell: python
        env:
          BASE_URL: https://trekmap-france.onrender.com
        run: |
          import json
          import os
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          checks = [
              ("/", "text"),
              ("/health/ready", "json"),
              ("/treks", "json"),
              ("/ai/status", "json"),
          ]

          for path, kind in checks:
              req = urllib.request.Request(
                  base + path,
                  headers={"User-Agent": "TrekMap-production-smoke/1.0"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  if response.status != 200:
                      raise SystemExit(f"{path}: HTTP {response.status}")
                  if not body:
                      raise SystemExit(f"{path}: réponse vide")
                  if kind == "json":
                      json.loads(body.decode("utf-8"))
                  print(f"{path}: HTTP 200, {len(body)} octets")

      - name: Verify all 140 published open-license hikes reach the public map
        shell: python
        env:
          BASE_URL: https://trekmap-france.onrender.com
        run: |
          from collections import Counter
          import json, os, time, urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          def load(path):
              started = time.monotonic()
              request = urllib.request.Request(base + path,
                  headers={"User-Agent":"TrekMap-catalog-smoke/1.0"})
              with urllib.request.urlopen(request, timeout=45) as response:
                  assert response.status == 200, (path,response.status)
                  raw = response.read()
                  data = json.loads(raw)
              print(f"{path}: {len(raw)} bytes, {time.monotonic()-started:.2f}s")
              return data

          treks=load("/treks")
          assert isinstance(treks,list) and len(treks)>=148, len(treks)
          old_prefixes=("lannion-tregor:","metropole-lyon:","parc-cevennes:","parc-ecrins:")
          new_prefixes=("cevennes-long:","ecrins-long:","gard-gr:","gard-grp:")
          imported=[t for t in treks if any("Référence : "+key in str(t.get("description",""))
                                              for key in old_prefixes)]
          long_treks=[t for t in treks if any("Référence : "+key in str(t.get("description",""))
                                             for key in new_prefixes)]
          assert len(imported)==140, f"Expected 140 original open routes, got {len(imported)}"
          assert len(long_treks)==35, f"Expected 35 new multi-day treks, got {len(long_treks)}"
          assert all(float(t["distance"])>=45 and float(t.get("duration_days") or 0)>=2
                     for t in long_treks), "Invalid multi-day lengths / duration"
          assert len({t["id"] for t in treks})==len(treks), "Duplicated public ID"
          region=Counter(t["region"] for t in imported)
          for region_name in ("Bretagne","Auvergne-Rhône-Alpes","Occitanie",
                              "Provence-Alpes-Côte d'Azur"):
              assert region[region_name]==35, (region_name,region[region_name])
          assert sum("Dénivelé non renseigné" in t["description"] for t in imported)==70
          geo=load("/treks/geojson")
          assert geo.get("type")=="FeatureCollection", geo.get("type")
          feats=geo.get("features",[])
          geo_ids={int(f.get("id", f.get("properties",{}).get("id"))) for f in feats}
          missing=sorted({int(t["id"]) for t in imported+long_treks}-geo_ids)
          assert not missing, f"Imported routes missing from map: {missing[:10]}"
          assert len(feats)>=183, len(feats)
          print(f"Public catalog: {len(treks)} visible treks; "
                f"140 original open routes + 35 new long routes; "
                f"{len(feats)} map traces validated.")
