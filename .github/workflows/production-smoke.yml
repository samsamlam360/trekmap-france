name: TrekMap production smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trekmap-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Verify deployed main commit
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Wait for Render to publish this exact commit
        shell: python
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://trekmap-france.onrender.com
        run: |
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          expected = os.environ["EXPECTED_SHA"].strip().lower()
          base = os.environ["BASE_URL"].rstrip("/")
          last = "aucune réponse"

          for attempt in range(1, 31):
              try:
                  req = urllib.request.Request(
                      base + "/ai/status",
                      headers={"User-Agent": "TrekMap-production-smoke/1.0"},
                  )
                  with urllib.request.urlopen(req, timeout=20) as response:
                      payload = json.load(response)
                  build = str(payload.get("build_commit") or "").strip().lower()
                  channel = payload.get("release_channel")
                  pipeline = str(payload.get("pipeline_version") or "")
                  last = f"HTTP 200 build={build[:10] or '?'} channel={channel} pipeline={pipeline}"
                  if build == expected:
                      print(f"Render sert le commit attendu après {attempt} tentative(s): {build[:10]}")
                      break
              except Exception as exc:
                  last = f"{type(exc).__name__}: {exc}"
              print(f"Tentative {attempt}/30: {last}")
              time.sleep(10)
          else:
              raise SystemExit(
                  "Render n'a pas publié le commit attendu dans la fenêtre de contrôle. "
                  f"Attendu={expected[:10]}, dernier état={last}"
              )

          assert payload.get("release_channel") == "v9-stable", payload
          assert payload.get("stability_gate") == "required", payload
          assert payload.get("golden_prompt_count") == 5, payload
          assert payload.get("field_scenario_count") == 40, payload
          assert payload.get("field_suite") == "required", payload
          assert pipeline.startswith("v9-explicit-"), payload

      - name: Smoke public production endpoints
        shell: python
        env:
          BASE_URL: https://trekmap-france.onrender.com
        run: |
          import json
          import os
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          checks = [
              ("/", "text"),
              ("/health/ready", "json"),
              ("/treks", "json"),
              ("/ai/status", "json"),
          ]

          for path, kind in checks:
              req = urllib.request.Request(
                  base + path,
                  headers={"User-Agent": "TrekMap-production-smoke/1.0"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  if response.status != 200:
                      raise SystemExit(f"{path}: HTTP {response.status}")
                  if not body:
                      raise SystemExit(f"{path}: réponse vide")
                  if kind == "json":
                      json.loads(body.decode("utf-8"))
                  print(f"{path}: HTTP 200, {len(body)} octets")

      - name: Verify curated multi-day open-license hikes reach the public map
        shell: python
        env:
          BASE_URL: https://trekmap-france.onrender.com
        run: |
          from collections import Counter
          import json, os, time, urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          def load(path):
              started = time.monotonic()
              request = urllib.request.Request(base + path,
                  headers={"User-Agent":"TrekMap-catalog-smoke/1.0"})
              with urllib.request.urlopen(request, timeout=45) as response:
                  assert response.status == 200, (path,response.status)
                  raw = response.read()
                  data = json.loads(raw)
              print(f"{path}: {len(raw)} bytes, {time.monotonic()-started:.2f}s")
              return data

          treks=load("/treks")
          assert isinstance(treks,list) and len(treks)>=80, len(treks)
          old_prefixes=("lannion-tregor:","metropole-lyon:","parc-cevennes:","parc-ecrins:")
          new_prefixes=("cevennes-long:","ecrins-long:","gard-gr:","gard-grp:")
          imported=[t for t in treks if any("Référence : "+key in str(t.get("description",""))
                                              for key in old_prefixes)]
          long_treks=[t for t in treks if any("Référence : "+key in str(t.get("description",""))
                                             for key in new_prefixes)]
          national_official=[t for t in treks if "Référence : regional-" in str(t.get("description",""))]
          national_osm=[t for t in treks if "Référence : osm-rel:" in str(t.get("description",""))]
          # 123 short open-data circuits were deliberately removed from Neon.
          # Leave user-created treks untouched, even if they are under one day.
          assert len(imported)==17, f"Expected 17 retained original open routes, got {len(imported)}"
          assert len(long_treks)==35, f"Expected 35 multi-day treks, got {len(long_treks)}"
          assert len(national_official)==12, f"Expected 12 licensed regional treks, got {len(national_official)}"
          assert len(national_osm)==8, f"Expected 8 ODbL regional treks, got {len(national_osm)}"
          assert all(float(t.get("duration_days") or 0)>=1 and float(t["distance"])>=20
                     for t in national_official+national_osm)
          assert all("OpenStreetMap" in t["description"] and "ODbL" in t["description"]
                     for t in national_osm), "Missing mandatory ODbL attribution"
          expected_regions={
              "Bretagne","Normandie","Pays de la Loire","Centre-Val de Loire",
              "Nouvelle-Aquitaine","Bourgogne-Franche-Comté","Grand Est",
              "Hauts-de-France","Île-de-France","Auvergne-Rhône-Alpes","Corse",
              "Occitanie","Provence-Alpes-Côte d'Azur"
          }
          actual_regions={t["region"] for t in treks}
          assert expected_regions<=actual_regions, (
              "Missing hiking regions: "+str(sorted(expected_regions-actual_regions)))
          assert all(float(t.get("duration_days") or 0)>=1 for t in imported+long_treks), (
              "A short official open-data walk was unexpectedly republished")
          assert all(float(t["distance"])>=45 and float(t.get("duration_days") or 0)>=2
                     for t in long_treks), "Invalid multi-day lengths / duration"
          assert len({t["id"] for t in treks})==len(treks), "Duplicated public ID"
          region=Counter(t["region"] for t in imported)
          assert region=={"Occitanie":9,"Provence-Alpes-Côte d'Azur":8},region
          geo=load("/treks/geojson")
          assert geo.get("type")=="FeatureCollection", geo.get("type")
          feats=geo.get("features",[])
          geo_ids={int(f.get("id", f.get("properties",{}).get("id"))) for f in feats}
          missing=sorted({int(t["id"]) for t in imported+long_treks+national_official+national_osm}-geo_ids)
          assert not missing, f"Imported routes missing from map: {missing[:10]}"
          assert len(feats)>=80, len(feats)
          print(f"National catalog: {len(treks)} visible treks in 13 regions; "
                f"17 original + 35 long + 12 official regional + 8 ODbL, "
                f"{len(feats)} GPS traces validated. User treks preserved.")
