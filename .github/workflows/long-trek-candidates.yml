name: Collect verified long-distance hiking trail candidates
on:
  push:
    branches:
      - "feat/long-treks-*"
    paths:
      - scripts/prepare_long_treks.py
      - .github/workflows/long-trek-candidates.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public-data parser
        run: python -m pip install --disable-pip-version-check requests pyproj
      - name: Extract official complete long trails for review (never write Neon)
        run: python scripts/prepare_long_treks.py
      - name: Save report on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/long_trek_candidates.json data/long_trek_diagnostics.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: review multi-day official hiking route candidates"
          git push origin HEAD:"${{ github.ref_name }}"
