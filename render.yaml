services:
  - type: web
    name: trekmap-france
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/apply_ui_remodel.py && python scripts/apply_unified_experience.py && python scripts/finalize_unified_build.py && python scripts/apply_mobile_experience.py && python scripts/apply_map_polish.py && python scripts/apply_ai_planner.py && python scripts/apply_free_planner_labels.py && python scripts/apply_language_learning_ui.py && python scripts/apply_reasoning_agent_ui.py && python scripts/apply_trekbrain_ui.py
    startCommand: uvicorn backend.app_v5:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: TREKMAP_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://trekmap-france.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: trekmap-france-db
          property: connectionString
      - key: ORS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: TREKBRAIN_REFLECTION
        value: "1"
      - key: TREKBRAIN_REFLECTION_THRESHOLD
        value: "68"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAX_GPX_BYTES
        value: "26214400"
      - key: MAX_GPX_INPUT_POINTS
        value: "300000"
      - key: SESSION_DURATION_DAYS
        value: "30"

databases:
  - name: trekmap-france-db
    plan: free
    databaseName: trekmap
    user: trekmap
    postgresMajorVersion: "17"
