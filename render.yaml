services:
  - type: web
    name: trekmap-france
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/apply_ui_remodel.py && python scripts/apply_stable_explorer.py
    startCommand: uvicorn backend.main_production:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TREKMAP_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://trekmap-france.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: trekmap-france-db
          property: connectionString
      - key: ORS_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAX_GPX_BYTES
        value: "26214400"
      - key: MAX_GPX_INPUT_POINTS
        value: "300000"
      - key: SESSION_DURATION_DAYS
        value: "30"

databases:
  - name: trekmap-france-db
    plan: free
    databaseName: trekmap
    user: trekmap
    postgresMajorVersion: "17"
