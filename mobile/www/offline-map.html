<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carte TrekMap hors ligne</title>
<link rel="stylesheet" href="/assets/public/vendor/maplibre-gl.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,sans-serif;color:#133c29;background:#e4eee7}
#map{position:absolute;inset:0}
#head{position:absolute;top:env(safe-area-inset-top);left:10px;right:10px;z-index:3;background:#f9fff8f2;border-radius:13px;padding:10px 13px;box-shadow:0 3px 16px #132a1c23}
#name{font-size:16px;font-weight:800;margin:0}
#status{font-size:12px;margin-top:3px;color:#5a6c62}
#actions{position:absolute;right:10px;bottom:25px;z-index:3;display:flex;flex-direction:column;gap:8px}
button{font:inherit;border:0;border-radius:12px;background:#116a47;color:white;min-height:45px;padding:10px 13px;box-shadow:0 3px 12px #112f2026}
#legend{position:absolute;bottom:25px;left:10px;z-index:2;background:#f9fff8e6;border-radius:10px;padding:7px 10px;font-size:11px;max-width:60%}
#fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:25px;background:#edf7ee}
#fallback p{max-width:300px;line-height:1.6}
</style></head><body>
<div id="map"></div><div id="fallback"><p>Le moteur cartographique local n'a pas pu démarrer. Le tracé du trek reste disponible dans l'écran précédent.</p></div>
<div id="head"><div id="name">Carte hors réseau</div><div id="status">Chargement des tuiles enregistrées…</div></div>
<div id="actions"><button id="center">◎ Me centrer</button><button id="full">⌖ Voir le trek</button></div>
<div id="legend">🟢 Tracé prévu · 🔵 GPS · 🟤 Chemins · 💧 Eau<br>Les zones non téléchargées restent vides.</div>
<script src="/assets/public/vendor/maplibre-gl.js"></script><script>
'use strict';
const el=id=>document.getElementById(id);
let map,route,tracked=null;
function featureLine(points){return {type:'Feature',properties:{},geometry:{type:'LineString',coordinates:points.map(p=>[p[1],p[0]])}}}
function bounds(points){const b=new maplibregl.LngLatBounds();points.forEach(p=>b.extend([p[1],p[0]]));return b}
const empty={type:'FeatureCollection',features:[]};
async function start(){
 try{
  const res=await fetch('/data/route.json',{cache:'no-store'});if(!res.ok)throw Error('Tracé manquant');
  route=await res.json();const points=route.coords;
  if(!Array.isArray(points)||points.length<2)throw Error('Tracé invalide');
  el('name').textContent=route.name||'Randonnée';
  if(typeof maplibregl==='undefined')throw Error('Moteur cartographique manquant');
  const style={version:8,name:'Carte TrekMap hors ligne',sources:{
   base:{type:'vector',tiles:['https://appassets.androidplatform.net/tiles/{z}/{x}/{y}.pbf'],minzoom:9,maxzoom:14},
   trek:{type:'geojson',data:{type:'FeatureCollection',features:[featureLine(points)]}},
   path:{type:'geojson',data:empty},
   gps:{type:'geojson',data:empty}
  },layers:[
   {id:'bg',type:'background',paint:{'background-color':'#e6eee7'}},
   {id:'forest',type:'fill',source:'base','source-layer':'landcover',filter:['==','class','wood'],paint:{'fill-color':'#bcd8b3'}},
   {id:'park',type:'fill',source:'base','source-layer':'landuse',filter:['in','class','park','grass','cemetery'],paint:{'fill-color':'#cde8b9'}},
   {id:'water',type:'fill',source:'base','source-layer':'water',paint:{'fill-color':'#93ceef'}},
   {id:'waterlines',type:'line',source:'base','source-layer':'waterway',paint:{'line-color':'#68b4d9','line-width':2}},
   {id:'roads',type:'line',source:'base','source-layer':'transportation',filter:['!in','class','path','track'],paint:{'line-color':'#c6af91','line-width':['interpolate',['linear'],['zoom'],9,.6,14,3]}},
   {id:'paths',type:'line',source:'base','source-layer':'transportation',filter:['in','class','path','track'],paint:{'line-color':'#9a7c49','line-width':['interpolate',['linear'],['zoom'],9,1,14,2.5],'line-dasharray':[3,1]}},
   {id:'shadow',type:'line',source:'trek',paint:{'line-color':'#fff','line-width':9}},
   {id:'route',type:'line',source:'trek',paint:{'line-color':'#0c7e53','line-width':5}},
   {id:'walk',type:'line',source:'path',paint:{'line-color':'#ed7423','line-width':4}},
   {id:'gpsring',type:'circle',source:'gps',paint:{'circle-radius':11,'circle-color':'#fff'}},
   {id:'gpsdot',type:'circle',source:'gps',paint:{'circle-radius':7,'circle-color':'#246bc4'}}
  ]};
  map=new maplibregl.Map({container:'map',style,center:[points[0][1],points[0][0]],zoom:12,maxZoom:16});
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-left');
  map.on('load',()=>map.fitBounds(bounds(points),{padding:55,maxZoom:14,duration:0}));
  map.on('error',()=>{el('status').textContent='Certaines tuiles sont manquantes. Prépare cette section en Wi-Fi.'});
  el('full').onclick=()=>map.fitBounds(bounds(points),{padding:55,maxZoom:14});
  el('center').onclick=()=>{if(tracked)map.easeTo({center:[tracked[1],tracked[0]],zoom:15});};
  el('status').textContent='Carte vectorielle locale · fonctionnelle en mode avion si téléchargée';
  await updateGps();
  setInterval(updateGps,2500);
 }catch(e){el('fallback').style.display='flex';el('status').textContent=String(e.message||e)}
}
async function updateGps(){
 try{
  const res=await fetch('/data/session.json',{cache:'no-store'});if(!res.ok)return;
  const s=await res.json();if(s.route?.id!==route.id)return;
  if(Number.isFinite(s.lastLat)&&Number.isFinite(s.lastLon)){
    tracked=[s.lastLat,s.lastLon];
    map.getSource('gps')?.setData({type:'FeatureCollection',features:[{type:'Feature',properties:{},geometry:{type:'Point',coordinates:[tracked[1],tracked[0]]}}]});
  }
  if(Array.isArray(s.points)&&s.points.length>=2)
    map.getSource('path')?.setData({type:'FeatureCollection',features:[featureLine(s.points)]});
 }catch(_){}
}
start();
</script></body></html>
